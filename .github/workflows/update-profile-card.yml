name: Update profile card

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'tools/cards.py'
      - '.github/workflows/update-profile-card.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test profile card generator
        run: python -m unittest discover -s tests
      - name: Generate dark and light profile cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/cards.py
      - name: Commit changed cards
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile-card-dark.svg profile-card-light.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update profile cards"
            git push
          fi
